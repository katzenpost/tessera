name = "Tessera"
version = "0.1.0"
description = "Terminal user interfaces in Lean 4"
keywords = ["tui", "terminal", "ui", "security"]
license = "AGPL-3.0-only"
defaultTargets = ["Tessera"]

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false

[[require]]
name = "crossterm-lean-ffi"
git = "https://github.com/katzenpost/crossterm-lean-ffi"
rev = "8488514aa9de05ed5d59506b2df25b7bdfa26b44"

[[lean_lib]]
name = "Tessera"

[[lean_lib]]
name = "Demo"
srcDir = "examples"

[[lean_exe]]
name = "tessera-test"
root = "Tessera.Tests.Main"

[[lean_exe]]
name = "tessera-demo"
root = "Demo"
srcDir = "examples"

[[lean_exe]]
name = "tessera-vterm"
root = "Tessera.Tests.VTerm"
