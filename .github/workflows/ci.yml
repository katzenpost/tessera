name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # crossterm-lean-ffi builds its Rust half with the runner's cargo.
      - uses: leanprover/lean-action@v1
        with:
          build: false
          test: false
          lint: false
      - name: Build, check the proofs and run the tests
        run: make ci
      - name: Build the benchmarks (their own Lake project)
        working-directory: bench
        run: lake build

  vterm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install libvterm
        run: sudo apt-get update && sudo apt-get install -y libvterm-dev pkg-config
      - uses: leanprover/lean-action@v1
        with:
          build: false
          test: false
          lint: false
      - name: Check the output on libvterm
        run: make vterm
