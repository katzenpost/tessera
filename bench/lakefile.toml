name = "tessera-bench"
reservoir = false
version = "0.1.0"
packagesDir = "../.lake/packages"
defaultTargets = ["tessera-bench"]

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false

[[require]]
name = "LeanBench"
git = "https://github.com/alok/LeanBench"
rev = "250d2a892bf8c91ec3ae5de8517793e18379f97b"

# Declared last so that Tessera's pins take precedence over LeanBench's.
[[require]]
name = "Tessera"
path = "../"

[[lean_lib]]
name = "TesseraBench"
globs = ["TesseraBench.+"]

[[lean_exe]]
name = "tessera-bench"
root = "TesseraBench.Main"
